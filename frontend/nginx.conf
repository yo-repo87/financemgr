server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The app is built with base "/financemgr/" (Vite) and router basename
    # "/financemgr" (React Router) so it can live at a path prefix behind the
    # shared Cloudflare Tunnel. Both of these use an internal rewrite rather
    # than an HTTP redirect deliberately: nginx's `return`/redirect always
    # expands a path into an absolute URL using $scheme, and since Cloudflare
    # Tunnel terminates TLS at its edge and talks to nginx over plain HTTP,
    # $scheme here is "http" even when the original client used https - an
    # external redirect would downgrade the browser to an insecure hop. An
    # internal rewrite never touches the client's URL bar or its scheme.
    location = / {
        rewrite ^ /financemgr/ last;
    }

    location = /financemgr {
        rewrite ^ /financemgr/ last;
    }

    # API calls are proxied here (not exposed as a separate Cloudflare route)
    # so the browser only ever talks to one origin - avoids CORS and
    # cross-origin cookie complications entirely.
    location /financemgr/api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /financemgr/ {
        try_files $uri $uri/ /financemgr/index.html;
    }

    # nginx's default mime.types has no entry for .webmanifest, so it would
    # otherwise fall back to application/octet-stream - some browsers require
    # the correct manifest content-type before treating the app as installable.
    location = /financemgr/manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
