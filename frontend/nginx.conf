server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's default mime.types has no entry for .webmanifest, so it would
    # otherwise fall back to application/octet-stream - some browsers require
    # the correct manifest content-type before treating the app as installable.
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
