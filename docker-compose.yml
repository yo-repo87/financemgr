name: financemgr

# db now lives in the shared-postgres instance (see
# /home/pi/.claude/plans/recursive-hopping-sifakis.md) - financemgr_db is stopped,
# not deleted, kept as a rollback path.
services:
  backend:
    build:
      context: ./backend
    container_name: financemgr_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
    ports:
      - "3141:4000"
    networks:
      - financemgr-net
      - shared-postgres-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3141}
    container_name: financemgr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3140:80"
    networks:
      - financemgr-net

networks:
  financemgr-net:
    driver: bridge
  shared-postgres-net:
    external: true
